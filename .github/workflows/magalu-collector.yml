name: Magalu Collector

on:
  pull_request:
    paths:
      - "src/scrapers/magazine_scraper.py"
      - "src/scrapers/browser_scraper.py"
      - "src/main.py"
      - "tests/test_magalu_*.py"
      - ".github/workflows/magalu-collector.yml"
  push:
    branches: [main]
    paths:
      - "src/scrapers/magazine_scraper.py"
      - "src/scrapers/browser_scraper.py"
      - "src/main.py"
      - "tests/test_magalu_*.py"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Testar coleta Magalu
        run: |
          python -m pytest -q             tests/test_magalu_cloud_block_v14_4.py             tests/test_magalu_cloud_fallback_v14_5.py             tests/test_magalu_blocked_fallback_v14_15.py
