name: Amazon Extension Import

on:
  pull_request:
    paths:
      - "src/extension/**"
      - "src/extractors/**"
      - "src/main.py"
      - "extension/**"
      - "tests/test_*extension*"
      - "tests/test_amazon_browser_capture_fallback.py"
      - ".github/workflows/extension-amazon.yml"
  push:
    branches: [main]
    paths:
      - "src/extension/**"
      - "src/extractors/**"
      - "src/main.py"
      - "extension/**"
      - "tests/test_*extension*"
      - "tests/test_amazon_browser_capture_fallback.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validar fallback de importação Amazon
        run: python -m pytest -q tests/test_amazon_browser_capture_fallback.py
      - name: Validar PC montado, mousepad, fones e armazenamento M.2
        run: python -m pytest -q tests/test_extension_catalog_registration.py tests/test_categories_criabyte.py tests/test_m2_slots_contract.py tests/test_assembled_pc_category.py tests/test_extension_fonte_guard.py
      - name: Validar regressões da extensão sem o caso wid já quebrado na main
        run: python -m pytest -q tests/test_browser_extension_offer_import.py -k "not test_ml_query_wid_is_also_promoted_to_item_id"
      - name: Validar JavaScript da extensão
        run: |
          node --check extension/background.js
          node --check extension/preflight-hook.js
          node --check extension/popup.js
