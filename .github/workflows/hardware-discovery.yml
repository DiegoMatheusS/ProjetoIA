name: Hardware Discovery

on:
  pull_request:
    paths:
      - "src/discovery/**"
      - "src/enrichment/**"
      - "src/extractors/**"
      - "config/manufacturer_domains.json"
      - "tests/test_discovery_*.py"
      - ".github/workflows/hardware-discovery.yml"
  push:
    branches: [main]
    paths:
      - "src/discovery/**"
      - "src/enrichment/**"
      - "src/extractors/**"
      - "config/manufacturer_domains.json"
      - "tests/test_discovery_*.py"

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Testar descoberta e categorias
        run: |
          python -m pytest -q             tests/test_discovery_v14_17_sources.py             tests/test_discovery_v14_20_3_all_categories.py             tests/test_categories_criabyte.py
