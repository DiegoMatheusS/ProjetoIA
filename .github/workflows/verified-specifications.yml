name: Verified product specifications
on:
  pull_request:
    paths: ['src/research_agent/**', 'src/build_detection/**', 'src/technical_ai/**', 'src/api.py', 'src/extractors/ml_specs.py', 'tests/test_verified_specification_intake.py', '.github/workflows/verified-specifications.yml']
  push:
    branches: [main]
    paths: ['src/research_agent/**', 'src/build_detection/**', 'src/technical_ai/**', 'src/api.py', 'src/extractors/ml_specs.py']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_verified_specification_intake.py tests/test_technical_ai_auto_v14_20_14.py tests/test_build_listing_analyzer.py tests/test_build_title_detection_20260930.py tests/test_technical_research_time_budget_v14_29.py tests/test_structured_page_collection.py tests/test_link_page_collection.py tests/test_ryzen_7600_parser.py tests/test_notebook_specs_quality.py
