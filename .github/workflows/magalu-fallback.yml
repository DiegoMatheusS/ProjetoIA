name: Magalu Fallback

on:
  pull_request:
    paths:
      - "src/main.py"
      - "src/scrapers/magazine_scraper.py"
      - "src/scrapers/browser_scraper.py"
      - "tests/test_magalu_blocked_fallback_chat.py"
      - ".github/workflows/magalu-fallback.yml"
  push:
    branches: [main]
    paths:
      - "src/main.py"
      - "src/scrapers/magazine_scraper.py"
      - "src/scrapers/browser_scraper.py"
      - "tests/test_magalu_blocked_fallback_chat.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Testar fallback da Magalu
        run: python -m unittest tests.test_magalu_blocked_fallback_chat
