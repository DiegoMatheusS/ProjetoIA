name: Link Page Collection
on:
  pull_request:
    paths:
      - 'src/scrapers/**'
      - 'src/utils/public_http.py'
      - 'src/utils/product_links.py'
      - 'src/api.py'
      - 'src/main.py'
      - 'src/shopee/**'
      - 'produto_IA/src/**'
      - 'tests/test_link_page_collection.py'
      - '.github/workflows/link-page-collection.yml'
  push:
    branches: [main]
    paths:
      - 'src/scrapers/**'
      - 'src/utils/public_http.py'
      - 'src/utils/product_links.py'
      - 'src/api.py'
      - 'src/main.py'
      - 'src/shopee/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Validar coleta e isolamento comercial
        run: python -m pytest -q tests/test_link_page_collection.py tests/test_generic_scraper.py tests/test_shopee_page_details.py tests/test_technical_ai_commercial_isolation_v14_20_15.py
      - name: Validar fontes de implantação
        run: |
          for source in version.py scrapers/generic_scraper.py scrapers/product_page_crawler.py scrapers/link_page_details.py utils/public_http.py utils/product_links.py; do
            cmp "src/$source" "produto_IA/src/$source"
          done
          python -m compileall -q src produto_IA/src
      - name: Validar coleta na implantação legada
        working-directory: produto_IA
        run: python -m pytest -q -c /dev/null --import-mode=importlib ../tests/test_link_page_collection.py -k 'not api_keeps_official_price and not commercial_api_does_not_run'
